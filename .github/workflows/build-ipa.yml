name: Build WebDriverAgent IPA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository at v1.0.0
        uses: actions/checkout@v4
        with:
          ref: v1.0.0  # 👈 关键点：这里强行指定拉取 v1.0.0 版本代码

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          # 1. 精确定位编译生成的 Runner.app 路径
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found APP at: $APP_PATH"
          
          # 2. 创建标准 Payload 结构并打包
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgentRunner.ipa Payload
          
          echo "IPA 打包完成！"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-v1.0.0-Unsigned
          path: WebDriverAgentRunner.ipa
