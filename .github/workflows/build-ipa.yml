name: Build iOS-Tagent IPA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout iOS-Tagent
        uses: actions/checkout@v4
        with:
          repository: 'AirtestProject/iOS-Tagent' # 直接拉取网易官方 iOS-Tagent 源码
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          # 强行设置最低部署目标为 iOS 12.0，并忽略过时 API 警告
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          # 1. 查找编译生成的 Runner.app
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find WebDriverAgentRunner-Runner.app"
            exit 1
          fi

          # 2. 打包成标准 IPA 文件
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r iOS-Tagent-Runner.ipa Payload

          echo "IPA 打包完成！"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Tagent-Runner-Unsigned
          path: iOS-Tagent-Runner.ipa
