name: Build WebDriverAgent IPA for iOS 12 (v4.5.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository at v4.5.1
        uses: actions/checkout@v4
        with:
          repository: 'fone26/WebDriverAgent' # 你的仓库地址
          ref: 'v4.5.1'                        # 指定检出 v4.5.1 Tag/分支
          submodules: 'recursive'              # 递归拉取子模块（防止缺失依赖）
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          # 强行指定支持 iOS 12.0 并禁用警告转错误
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          # 1. 查找编译生成的 Runner.app
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find WebDriverAgentRunner-Runner.app"
            exit 1
          fi

          # 2. 构建标准 Payload 压缩结构
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgentRunner.ipa Payload

          echo "IPA 打包完成！"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-v4.5.1-Unsigned
          path: WebDriverAgentRunner.ipa
