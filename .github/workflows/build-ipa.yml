name: Build Compatible WDA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # 👈 使用官方支持的 macos-14 环境

    steps:
      - name: Checkout Appium WDA v4.10.0
        uses: actions/checkout@v4
        with:
          repository: 'appium/WebDriverAgent'
          ref: 'v4.10.0'
          fetch-depth: 0

      # 动态配置 Xcode 14.3.1 环境
      - name: Setup Xcode 14.3.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.3.1'

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          plutil -replace MinimumOSVersion -string "12.0" "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WDA-v4.10.0-Xcode14.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-v4.10.0-Xcode14
          path: WDA-v4.10.0-Xcode14.ipa
