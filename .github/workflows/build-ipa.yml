name: Build WebDriverAgent IPA for iOS 12

on:
  workflow_dispatch: # 允许手动点击按钮触发构建

jobs:
  build:
    runs-on: macos-14 # 修改点 1：更新为当前主流的 macos-14 镜像

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # 修改点 2：使用 macos-14 上兼容老项目的 Xcode 15 版本
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          mkdir -p build
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 找到编译出来的 .app 目录并放入 Payload
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          # 压缩 Payload 为 IPA
          zip -r WebDriverAgentRunner.ipa Payload
          echo "IPA 构建成功！"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-Unsigned
          path: WebDriverAgentRunner.ipa
