name: Build Compatible WDA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    # 👈 关键点：改用 macos-12 runner（内置 Xcode 13/14，对 iOS 12 兼容性最好）
    runs-on: macos-12

    steps:
      - name: Checkout Appium WDA v4.10.0
        uses: actions/checkout@v4
        with:
          repository: 'appium/WebDriverAgent'
          ref: 'v4.10.0'
          fetch-depth: 0

      - name: Select Xcode 14
        run: |
          sudo xcode-select -s /Applications/Xcode_14.2.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          # 修改最低系统版本限制
          plutil -replace MinimumOSVersion -string "12.0" "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WDA-v4.10.0-Xcode14.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-v4.10.0-Xcode14
          path: WDA-v4.10.0-Xcode14.ipa
