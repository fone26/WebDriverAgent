name: Build WDA v4.10.0 for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Appium WDA v4.10.0
        uses: actions/checkout@v4
        with:
          repository: 'appium/WebDriverAgent'
          ref: 'v4.10.0' # 👈 专门针对 iOS 12 最稳定的 Appium WDA 版本
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build WebDriverAgentRunner
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          # 强制指定支持 iOS 12.0
          plutil -replace MinimumOSVersion -string "12.0" "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WDA-v4.10.0-Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-v4.10.0-Runner
          path: WDA-v4.10.0-Runner.ipa
