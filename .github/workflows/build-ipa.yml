name: Build Compatible WDA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Appium WDA v4.10.0
        uses: actions/checkout@v4
        with:
          repository: 'appium/WebDriverAgent'
          ref: 'v4.10.0'
          fetch-depth: 0

      # 直接使用 macos-14 最低且最稳定的 Xcode 15.0.1
      - name: Setup Xcode 15.0.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0.1'

      - name: Build WebDriverAgentRunner for iOS 12
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ENABLE_BITCODE=NO \
            CLANG_ENABLE_OBJC_WEAK=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="-Wl,-weak_reference_mismatches,weak -Wl,-no_compact_unwind"

      - name: Package to IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"

          # 强制修改最低系统要求为 12.0
          plutil -replace MinimumOSVersion -string "12.0" "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WDA-v4.10.0-iOS12.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-v4.10.0-iOS12
          path: WDA-v4.10.0-iOS12.ipa
